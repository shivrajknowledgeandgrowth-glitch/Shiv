name: Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java version
        run: java -version

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="v1.0.0-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          gh release create "${RELEASE_TAG}" \
            app/build/outputs/apk/debug/app-debug.apk \
            --target "${GITHUB_SHA}" \
            --title "Release ${RELEASE_TAG}" \
            --notes "Automated release containing app-debug.apk built from commit ${GITHUB_SHA}." \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "Release publishing succeeded."
            gh release view "${RELEASE_TAG}"
            RELEASE_URL=$(gh release view "${RELEASE_TAG}" --json url --jq .url)
            RELEASE_TITLE=$(gh release view "${RELEASE_TAG}" --json title --jq .title)
            echo "Release tag: ${RELEASE_TAG}"
            echo "Release title: ${RELEASE_TITLE}"
            echo "Release URL: ${RELEASE_URL}"
            echo "APK asset filename: app-debug.apk"
            
            echo "### Release Published Successfully" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Page:** [${RELEASE_TITLE}](${RELEASE_URL})" >> "$GITHUB_STEP_SUMMARY"
            echo "- **APK Asset:** \`app-debug.apk\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- The APK can be downloaded directly from the release **Assets** section at ${RELEASE_URL}." >> "$GITHUB_STEP_SUMMARY"
            echo "- The normal Actions artifact \`app-debug-apk\` is also available as a backup." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Release publishing failed or was not completed."
            echo "APK build succeeded."
            echo "The Actions artifact named app-debug-apk remains available."
            
            echo "### ⚠️ Release Publishing Warning" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Status:** The APK build succeeded, but release publishing failed." >> "$GITHUB_STEP_SUMMARY"
            echo "- The Actions artifact named \`app-debug-apk\` remains available for download under the workflow run summary." >> "$GITHUB_STEP_SUMMARY"
          fi
